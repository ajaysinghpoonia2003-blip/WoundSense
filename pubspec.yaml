name: woundsense
description: AI based diabetic foot ulcer detection app

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Pick image from camera/gallery
  image_picker: ^1.1.2

  # TensorFlow Lite
  tflite_flutter: ^0.11.0

  # Image processing
  image: ^4.2.0

  # Local first-time registration/login state
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/model.tflite
